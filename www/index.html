<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSIF LEARN 2.0</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Tajawal:wght@700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Fredoka','Tajawal';background:#F7F9FF;overflow-x:hidden}#intro{position:fixed;inset:0;background:linear-gradient(135deg,#FFD93D,#FF6B6B,#6C5CE7,#4ECDC4);background-size:400% 400%;animation:grad 3s infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99}#intro.hide{opacity:0;pointer-events:none;transition:0.8s}@keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}.logo{width:150px;height:150px;background:#fff;border-radius:35px;display:flex;align-items:center;justify-content:center;font-size:75px;animation:pop 1s;box-shadow:0 20px 40px rgba(0,0,0,.25)}@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}.app{display:none}.app.show{display:block}.head{background:linear-gradient(90deg,#6C5CE7,#FF6B6B);padding:16px 20px;color:#fff;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}.card{border-radius:22px;padding:16px;color:#fff;min-height:135px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 18px rgba(0,0,0,.18);cursor:pointer;transition:.15s}.card:active{transform:scale(.96)}.c1{background:linear-gradient(135deg,#FF6B6B,#FF8E53)}.c2{background:linear-gradient(135deg,#4ECDC4,#44A08D)}.c3{background:linear-gradient(135deg,#FFD93D,#FF9F1C)}.c4{background:linear-gradient(135deg,#6C5CE7,#A29BFE)}.c5{background:linear-gradient(135deg,#45B7D1,#96C93D)}.c6{background:linear-gradient(135deg,#FD79A8,#FDCB6E)}.c7{background:linear-gradient(135deg,#00B894,#00CEC9)}.c8{background:linear-gradient(135deg,#E17055,#FAB1A0)}.ico{font-size:46px}.t{font-size:17px}.ar{font-size:12px;opacity:.9}#lesson{position:fixed;inset:0;background:#fff;z-index:20;display:none;flex-direction:column}.top{background:linear-gradient(90deg,#6C5CE7,#FF6B6B);color:#fff;padding:14px;display:flex;gap:12px;align-items:center}.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}.img{width:170px;height:170px;background:#F0F3FF;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:90px;box-shadow:0 12px 28px rgba(0,0,0,.12)}.en{font-size:40px;color:#2D3436;margin-top:16px}.ar2{font-size:22px;color:#636E72}.ctrl{margin-top:20px;display:flex;gap:12px}.btn{padding:14px 24px;border:none;border-radius:30px;font-weight:700;font-size:16px;color:#fff;cursor:pointer}.speak{background:#4ECDC4}.next{background:#6C5CE7}.bar{height:6px;background:#eee}.fill{height:100%;background:linear-gradient(90deg,#6C5CE7,#FF6B6B);width:0%;transition:.3s}#quiz{position:fixed;inset:0;background:#fff;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}.q{font-size:28px;margin-bottom:16px}.opt{display:grid;gap:12px;width:100%;max-width:320px}.opt button{padding:16px;border:2px solid #eee;border-radius:16px;background:#fff;font-size:18px;font-weight:700;cursor:pointer}.opt button.correct{background:#00B894;color:#fff}.opt button.wrong{background:#FF6B6B;color:#fff}</style></head><body><div id="intro"><div class="logo">📚</div><h1 style="color:#fff;margin-top:18px;font-size:38px">WASSIF LEARN</h1><p style="color:#fff">English بطريقة زاهية!</p></div><div class="app" id="app"><div class="head"><b>🫒 WASSIF LEARN</b><span>⭐ <span id="sc">0</span></span></div><div class="grid"><div class="card c1" onclick="openT('animals')"><div class="ico">🐶</div><div><div class="t">Animals</div><div class="ar">الحيوانات</div></div></div><div class="card c2" onclick="openT('colors')"><div class="ico">🎨</div><div><div class="t">Colors</div><div class="ar">الألوان</div></div></div><div class="card c3" onclick="openT('numbers')"><div class="ico">🔢</div><div><div class="t">Numbers</div><div class="ar">الأرقام</div></div></div><div class="card c4" onclick="openT('food')"><div class="ico">🍎</div><div><div class="t">Food</div><div class="ar">الماكلة</div></div></div><div class="card c5" onclick="openT('family')"><div class="ico">👨‍👩‍👧</div><div><div class="t">Family</div><div class="ar">العائلة</div></div></div><div class="card c6" onclick="openT('body')"><div class="ico">🧍</div><div><div class="t">Body</div><div class="ar">الجسم</div></div></div><div class="card c7" onclick="openT('house')"><div class="ico">🏠</div><div><div class="t">House</div><div class="ar">الدار</div></div></div><div class="card c8" onclick="openT('clothes')"><div class="ico">👕</div><div><div class="t">Clothes</div><div class="ar">الحوايج</div></div></div></div></div><div id="lesson"><div class="top"><button onclick="closeL()" style="width:36px;height:36px;border-radius:50%;border:none;background:#fff">←</button><h3 id="tName"></h3></div><div class="bar"><div class="fill" id="fill"></div></div><div class="body"><div class="img" id="wImg"></div><div class="en" id="wEn"></div><div class="ar2" id="wAr"></div><div class="ctrl"><button class="btn speak" onclick="speak()">🔊</button><button class="btn next" onclick="nextW()">التالي ➡️</button></div></div></div><div id="quiz"><h2 class="q" id="qTxt"></h2><div class="opt" id="opts"></div></div><script>const D={animals:[{en:'Dog',ar:'كلب',em:'🐶'},{en:'Cat',ar:'قط',em:'🐱'},{en:'Lion',ar:'أسد',em:'🦁'},{en:'Elephant',ar:'فيل',em:'🐘'},{en:'Monkey',ar:'قرد',em:'🐒'}],colors:[{en:'Red',ar:'أحمر',em:'🔴'},{en:'Blue',ar:'أزرق',em:'🔵'},{en:'Yellow',ar:'أصفر',em:'🟡'},{en:'Green',ar:'أخضر',em:'🟢'},{en:'Orange',ar:'برتقالي',em:'🟠'}],numbers:[{en:'One',ar:'واحد',em:'1️⃣'},{en:'Two',ar:'اثنان',em:'2️⃣'},{en:'Three',ar:'ثلاثة',em:'3️⃣'},{en:'Four',ar:'أربعة',em:'4️⃣'},{en:'Five',ar:'خمسة',em:'5️⃣'}],food:[{en:'Apple',ar:'تفاحة',em:'🍎'},{en:'Banana',ar:'موز',em:'🍌'},{en:'Bread',ar:'خبز',em:'🍞'},{en:'Milk',ar:'حليب',em:'🥛'},{en:'Chicken',ar:'دجاج',em:'🍗'}],family:[{en:'Father',ar:'أب',em:'👨'},{en:'Mother',ar:'أم',em:'👩'},{en:'Brother',ar:'أخ',em:'👦'},{en:'Sister',ar:'أخت',em:'👧'},{en:'Baby',ar:'رضيع',em:'👶'}],body:[{en:'Head',ar:'رأس',em:'🙂'},{en:'Eye',ar:'عين',em:'👁️'},{en:'Hand',ar:'يد',em:'✋'},{en:'Heart',ar:'قلب',em:'❤️'},{en:'Nose',ar:'أنف',em:'👃'}],house:[{en:'Door',ar:'باب',em:'🚪'},{en:'Bed',ar:'سرير',em:'🛏️'},{en:'Chair',ar:'كرسي',em:'🪑'},{en:'Book',ar:'كتاب',em:'📚'},{en:'Lamp',ar:'مصباح',em:'💡'}],clothes:[{en:'Shirt',ar:'قميص',em:'👕'},{en:'Pants',ar:'سروال',em:'👖'},{en:'Hat',ar:'قبعة',em:'🧢'},{en:'Shoe',ar:'حذاء',em:'👟'},{en:'Dress',ar:'فستان',em:'👗'}]};let cur=null,i=0,score=Number(localStorage.getItem('ws')||0);document.getElementById('sc').innerText=score;setTimeout(()=>{document.getElementById('intro').classList.add('hide');document.getElementById('app').classList.add('show')},2500);function openT(t){cur=t;i=0;document.getElementById('lesson').style.display='flex';document.getElementById('tName').innerText=t;show()}function closeL(){document.getElementById('lesson').style.display='none'}function show(){const w=D[cur][i];document.getElementById('wImg').innerText=w.em;document.getElementById('wEn').innerText=w.en;document.getElementById('wAr').innerText=w.ar;document.getElementById('fill').style.width=((i+1)/D[cur].length*100)+'%';speak()}function nextW(){if(i<D[cur].length-1){i++;show();add(10)}else{startQuiz()}}function add(n){score+=n;localStorage.setItem('ws',score);document.getElementById('sc').innerText=score;beep(600,900)}function speak(){const w=D[cur][i];const u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';speechSynthesis.speak(u)}function beep(f1,f2){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(f1,c.currentTime);o.frequency.linearRampToValueAtTime(f2,c.currentTime+.2);g.gain.setValueAtTime(.5,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.3);o.start();o.stop(c.currentTime+.3)}catch(e){}}function startQuiz(){const list=D[cur];const q=list[Math.floor(Math.random()*list.length)];document.getElementById('lesson').style.display='none';document.getElementById('quiz').style.display='flex';document.getElementById('qTxt').innerText='ما معنى '+q.em+' '+q.en+' ?';const opts=[q.ar];while(opts.length<3){const r=list[Math.floor(Math.random()*list.length)].ar;if(!opts.includes(r))opts.push(r)}opts.sort(()=>Math.random()-.5);const box=document.getElementById('opts');box.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.innerText=o;b.onclick=()=>{if(o===q.ar){b.classList.add('correct');add(50);setTimeout(()=>{document.getElementById('quiz').style.display='none';closeL();alert('🎉 برافو! ربحتي 50 نقطة!')},400)}else{b.classList.add('wrong');beep(900,300)}};box.appendChild(b)})}</script></body></html>
