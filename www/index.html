const list=document.getElementById('list'), q=document.getElementById('q'), stats=document.getElementById('stats');
function speak(t,lang){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t);
  u.lang=lang==='ar'?'ar-SA':'en-US'; u.rate=0.9;
  speechSynthesis.speak(u);
}
function render(arr){
 list.innerHTML=''; stats.textContent=arr.length+' نتيجة / 20000';
 arr.slice(0,300).forEach(([ar,en,type])=>{
   let d=document.createElement('div'); d.className='card';
   let arE=ar.replace(/'/g,"\\'"); let enE=en.replace(/'/g,"\\'");
   d.innerHTML=`<div><div class="ar">${ar} <button class="btn" onclick="speak('${arE}','ar')">🔊</button></div><div style="font-size:10px;color:#999">${type}</div></div><div style="display:flex;align-items:center"><div class="en">${en}</div><button class="btn" onclick="speak('${enE}','en')">🔊</button></div>`;
   list.appendChild(d);
 });
}
function search(v){
 v=v.trim().toLowerCase();
 if(!v){render(DICT); return}
 let r=DICT.filter(([ar,en])=>ar.includes(v)||en.toLowerCase().includes(v));
 render(r);
}
q.addEventListener('input',e=>search(e.target.value));
// إخفاء الانترو بعد 2.5 ثانية
setTimeout(()=>{
  document.getElementById('intro').classList.add('hide');
  document.body.style.overflow='auto';
