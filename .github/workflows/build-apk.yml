name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Clean Gradle Cache
        run: rm -rf ~/.gradle/caches/ ~/.gradle/wrapper/
          
      - name: Create Capacitor Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId":"com.wassif.learn","appName":"WASSIF LEARN","webDir":".","bundledWebRuntime":false}' > capacitor.config.json
          npx cap add android
          npx cap copy android
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wassif-learn-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
