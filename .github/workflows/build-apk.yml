name: Build APK
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.4.2-bin.zip
          unzip -q gradle-7.4.2-bin.zip
          echo "$PWD/gradle-7.4.2/bin" >> $GITHUB_PATH
      - name: Build APK
        run: |
          rm -rf android
          mkdir -p android/app/src/main/java/com/wassif/learn
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/
          cat > android/settings.gradle << 'SET'
          include ':app'
          SET
          cat > android/build.gradle << 'ROOT'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ROOT
          cat > android/app/build.gradle << 'APP'
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 34
              defaultConfig {
                  applicationId "com.wassif.learn"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 26
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          APP
          cat > android/app/src/main/AndroidManifest.xml << 'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.wassif.learn"><uses-permission android:name="android.permission.INTERNET"/><application android:label="WASSIF LEARN" android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MAN
          echo '<resources><string name="app_name">WASSIF LEARN</string></resources>' > android/app/src/main/res/values/strings.xml
          cat > android/app/src/main/java/com/wassif/learn/MainActivity.java << 'JAVA'
          package com.wassif.learn; import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import android.webkit.WebViewClient; public class MainActivity extends Activity { protected void onCreate(Bundle s){ super.onCreate(s); WebView wv=new WebView(this); wv.setWebViewClient(new WebViewClient()); WebSettings ws=wv.getSettings(); ws.setJavaScriptEnabled(true); ws.setDomStorageEnabled(true); ws.setAllowFileAccess(true); ws.setAllowFileAccessFromFileURLs(true); ws.setAllowUniversalAccessFromFileURLs(true); wv.loadUrl("file:///android_asset/www/index.html"); setContentView(wv); } }
          JAVA
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android; gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wassif-learn-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: WASSIF LEARN APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
