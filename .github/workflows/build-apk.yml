name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build APK with FULL site
        run: |
          echo "Files in repo:"
          ls -la
          mkdir -p android/app/src/main/java/com/wassif/learn
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets
          
          # نسخ كلشي للموقع - جميع الملفات
          echo "Copying ALL files to assets..."
          cp -r *.html *.css *.js android/app/src/main/assets/ 2>/dev/null || true
          cp -r *.json android/app/src/main/assets/ 2>/dev/null || true
          for d in css js assets images img style scripts src public; do
            [ -d "$d" ] && cp -r "$d" android/app/src/main/assets/ && echo "Copied folder $d"
          done
          # نسخ كل الملفات لي كاينة فالروت
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.htm" \) -exec cp {} android/app/src/main/assets/ \;
          
          echo "Assets content:"
          ls -la android/app/src/main/assets/
          
          echo "include ':app'" > android/settings.gradle
          
          cat > android/build.gradle << 'GRADLE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          
          cat > android/app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.wassif.learn'
              compileSdk 34
              defaultConfig {
                  applicationId "com.wassif.learn"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE
          
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="WASSIF LEARN" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
          
          echo '<resources><string name="app_name">WASSIF LEARN</string></resources>' > android/app/src/main/res/values/strings.xml
          
          cat > android/app/src/main/java/com/wassif/learn/MainActivity.java << 'JAVA'
          package com.wassif.learn;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView wv = new WebView(this);
                  wv.setWebViewClient(new WebViewClient());
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setAllowContentAccess(true);
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
              }
          }
          JAVA
          
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          cd android
          ../gradle-8.5/bin/gradle assembleDebug --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wassif-learn-apk-full
          path: android/app/build/outputs/apk/debug/app-debug.apk
